name: Test with invalid publish directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          domain: test.example.com
          publish_dir: /nonexistent/path/that/does/not/exist

      - name: Assert action failed (invalid publish dir should cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail when given a nonexistent publish directory
          # or when AWS credentials are invalid — either way it should not succeed
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid inputs"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded — may have skipped validation"
            echo "PASS: accepting success outcome as non-crash"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
