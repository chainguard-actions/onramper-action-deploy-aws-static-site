name: Test with relative publish directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create relative publish directory with sample content
        run: |
          mkdir -p dist
          echo "<html><body>Test Site</body></html>" > dist/index.html
          echo "body { color: red; }" > dist/style.css

      - id: action
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          domain: staging.example.com
          publish_dir: dist

      - name: Assert action ran with relative publish dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with an AWS error
          # It should NOT fail with a missing input error or path resolution error
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected with relative publish dir (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
