name: Test basic usage - deploy static site to AWS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with sample content
        run: |
          mkdir -p /tmp/site
          echo "<html><body>Hello World</body></html>" > /tmp/site/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          domain: test.example.com
          publish_dir: /tmp/site

      - name: Assert action ran (expected to fail with AWS error, not input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail due to AWS credential issues,
          # not due to missing/invalid inputs. Both 'success' and 'failure' are
          # acceptable here — what matters is the action was invoked correctly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with all required inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
