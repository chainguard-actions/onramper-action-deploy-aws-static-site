name: Test invalid domain validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: mkdir -p "$GITHUB_WORKSPACE/public"

      - id: action
        name: Run action with invalid domain (no dots - fails validation)
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
          domain: invaliddomain
          publish_dir: public

      - name: Assert action failed due to invalid domain
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action checks: if (domain.split(".").length < 2) throw Error("Invalid domain...")
          # "invaliddomain".split(".") = ["invaliddomain"], length = 1, which is < 2
          # So the action should throw and call core.setFailed(), resulting in failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid domain 'invaliddomain', but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid domain"
