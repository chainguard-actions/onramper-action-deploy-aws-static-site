name: Test subdomain domain validation passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          echo "<html><body>Subdomain test</body></html>" > "$GITHUB_WORKSPACE/dist/index.html"

      - id: action
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          domain: app.staging.example.org
          publish_dir: dist

      - name: Assert action did not fail due to domain validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The domain 'app.staging.example.org' has 4 parts (>= 2), so domain validation
          # should pass. The action will fail at CDK deploy due to fake AWS credentials,
          # but it must NOT fail with "Invalid domain" error.
          # We accept 'failure' (CDK deploy fails) but not a domain-validation failure.
          # Since we can't distinguish the failure reason from outcome alone, we just
          # confirm the action ran (outcome is set, not skipped/cancelled).
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was skipped or cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with subdomain domain (outcome: $OUTCOME)"
