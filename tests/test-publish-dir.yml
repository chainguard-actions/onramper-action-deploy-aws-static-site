name: Test publish directory with static site content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with typical static site content
        run: |
          mkdir -p /tmp/static-site/css
          mkdir -p /tmp/static-site/js
          echo "<html><head><link rel='stylesheet' href='css/style.css'></head><body><h1>My Site</h1><script src='js/app.js'></script></body></html>" > /tmp/static-site/index.html
          echo "body { margin: 0; font-family: sans-serif; }" > /tmp/static-site/css/style.css
          echo "console.log('app loaded');" > /tmp/static-site/js/app.js
          echo "User-agent: *" > /tmp/static-site/robots.txt
          ls -la /tmp/static-site/

      - id: action
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          domain: myapp.example.com
          publish_dir: /tmp/static-site

      - name: Assert action was invoked with multi-file publish directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (success or AWS credential failure), not crash
          # due to missing inputs or invalid publish_dir structure.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted multi-file publish directory"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
