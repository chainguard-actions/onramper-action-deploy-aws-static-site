name: Test action with valid domain succeeds (CDK lib does not call AWS)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create publish directory with sample content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          echo "<html><body>Hello</body></html>" > "$GITHUB_WORKSPACE/public/index.html"

      - id: action
        name: Run action with valid domain and fake AWS credentials
        uses: .
        continue-on-error: true
        with:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          domain: test.example.com
          publish_dir: public

      - name: Assert action succeeded (CDK lib exits 0, no real AWS calls made)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action runs 'node node_modules/aws-cdk-lib/index.js bootstrap'
          # which is the CDK construct library (not the CDK CLI), so it exits 0
          # without making any AWS API calls. Domain 'test.example.com' passes
          # validation (3 parts >= 2), so the action should succeed.
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with valid domain, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action succeeded as expected"
